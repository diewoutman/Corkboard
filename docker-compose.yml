services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: corkboard
      POSTGRES_USER: corkboard
      POSTGRES_PASSWORD: corkboard
    ports:
      - "5432:5432"
    volumes:
      - corkboard-postgres-data:/var/lib/postgresql/data

volumes:
  corkboard-postgres-data:
