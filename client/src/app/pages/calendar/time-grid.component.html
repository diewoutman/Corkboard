<div class="overflow-hidden rounded-3xl bg-white shadow-sticker">
  <!-- Day headers -->
  <div class="flex border-b-2 border-cork">
    <div class="w-12 shrink-0"></div>
    <div class="grid flex-1" [style.grid-template-columns]="'repeat(' + columns.length + ', minmax(0, 1fr))'">
      <div *ngFor="let column of columns; trackBy: trackByDayKey" class="border-l-2 border-cork px-1 py-1.5 text-center">
        <div class="text-[10px] font-extrabold uppercase text-ink-muted">{{ column.date | date: 'EEE' }}</div>
        <div class="text-sm font-extrabold text-ink" [class.text-coral]="isToday(column.date)">{{ column.date | date: 'd' }}</div>
      </div>
    </div>
  </div>

  <!-- All-day strip -->
  <div class="flex border-b-2 border-cork" *ngIf="hasAnyAllDay()">
    <div class="w-12 shrink-0 py-1 pr-1 text-right text-[9px] font-bold text-ink-muted">All day</div>
    <div class="grid flex-1" [style.grid-template-columns]="'repeat(' + columns.length + ', minmax(0, 1fr))'">
      <div *ngFor="let column of columns; trackBy: trackByDayKey" class="space-y-0.5 border-l-2 border-cork p-0.5">
        <span
          *ngFor="let o of column.allDay"
          class="block truncate rounded-md px-1 text-[10px] font-bold text-white"
          [style.background]="calendarColor(o.collectionId)"
        >{{ o.title }}</span>
      </div>
    </div>
  </div>

  <!-- Scrollable hour grid -->
  <div class="flex h-[32rem] select-none overflow-y-auto">
    <div class="w-12 shrink-0">
      <div *ngFor="let h of hours" class="relative" [style.height.px]="hourHeight">
        <span *ngIf="h > 0" class="absolute -top-2 right-1 text-[10px] font-bold text-ink-muted">{{ h }}:00</span>
      </div>
    </div>

    <div class="grid flex-1" [style.grid-template-columns]="'repeat(' + columns.length + ', minmax(0, 1fr))'">
      <div
        *ngFor="let column of columns; let i = index; trackBy: trackByDayKey"
        class="relative border-l-2 border-cork"
        [style.height.px]="hourHeight * 24"
        [attr.data-day-index]="i"
        (pointerdown)="onColumnPointerDown($event, i)"
      >
        <div *ngFor="let h of hours" class="border-t-2 border-cork" [style.height.px]="hourHeight"></div>

        <div
          *ngIf="isToday(column.date)"
          class="pointer-events-none absolute inset-x-0 z-10 border-t-2 border-danger"
          [style.top.px]="nowOffsetPx()"
        ></div>

        <div
          *ngFor="let laned of column.timed; trackBy: trackByOccurrenceKey"
          data-occurrence-block
          class="group absolute z-20 cursor-grab overflow-hidden rounded-lg px-1 py-0.5 text-[10px] font-bold leading-tight text-white shadow-[0_2px_0_0_rgba(0,0,0,0.12)] active:cursor-grabbing"
          [style.background]="calendarColor(laned.occurrence.collectionId)"
          [style.top.px]="topPx(laned.startMinutes)"
          [style.height.px]="heightPx(laned.endMinutes - laned.startMinutes)"
          [style.left]="(laned.lane / laned.laneCount) * 100 + '%'"
          [style.width]="'calc(' + (100 / laned.laneCount) + '% - 2px)'"
          (pointerdown)="onBlockPointerDown($event, laned, i)"
        >
          <button
            type="button"
            class="float-right ml-1 hidden shrink-0 leading-none opacity-80 hover:opacity-100 group-hover:inline"
            aria-label="Delete"
            (pointerdown)="$event.stopPropagation()"
            (click)="onDeleteClick($event, laned.occurrence)"
          >✕</button>
          {{ laned.occurrence.title }}
        </div>

        <div
          *ngIf="ghostVisible && ghostDayIndex === i"
          class="pointer-events-none absolute inset-x-0.5 z-30 rounded-md border-2 border-dashed border-coral bg-pastel-coral/70"
          [style.top.px]="ghostTop"
          [style.height.px]="ghostHeight"
        ></div>
      </div>
    </div>
  </div>
</div>
