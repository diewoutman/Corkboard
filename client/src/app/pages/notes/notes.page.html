<h1 class="text-2xl font-semibold text-gray-900">Notes</h1>

<p *ngIf="errorMessage" class="mt-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage }}</p>

<div *ngIf="loading" class="mt-8 text-center text-sm text-gray-500">Loading…</div>

<div *ngIf="!loading" class="mt-4 grid gap-3 sm:grid-cols-2">
  <div
    *ngFor="let note of notes"
    class="relative rounded-lg border border-gray-200 bg-yellow-50 p-4 shadow-sm"
  >
    <div class="absolute right-3 top-3 flex items-center gap-2">
      <button
        type="button"
        (click)="toggleImportant(note)"
        [class.text-amber-500]="note.isImportant"
        [class.text-gray-300]="!note.isImportant"
        class="hover:text-amber-500"
        [attr.aria-label]="note.isImportant ? 'Unmark as important' : 'Mark as important'"
      >★</button>
      <button type="button" (click)="deleteNote(note)" class="text-gray-400 hover:text-red-600" aria-label="Delete">✕</button>
    </div>
    <p class="pr-14 font-medium text-gray-900">{{ note.title }}</p>
    <p *ngIf="note.description" class="mt-1 whitespace-pre-line text-sm text-gray-700">{{ note.description }}</p>
    <div class="mt-2 flex flex-wrap gap-2">
      <span
        *ngFor="let memberId of note.assignedFamilyMemberIds"
        class="rounded-full px-2 py-0.5 text-xs font-medium text-white"
        [style.background]="memberColor(memberId)"
      >{{ memberName(memberId) }}</span>
    </div>
  </div>

  <div *ngIf="notes.length === 0" class="col-span-full rounded-lg border border-dashed border-gray-300 px-4 py-8 text-center text-sm text-gray-500">
    No notes here yet.
  </div>
</div>

<div *ngIf="showNewNoteForm" class="mt-4 rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
  <form (ngSubmit)="submitNewNote()" #form="ngForm" class="space-y-3">
    <div>
      <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
      <input
        id="title"
        name="title"
        [(ngModel)]="newNote.title"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>
    <div>
      <label for="description" class="block text-sm font-medium text-gray-700">Note</label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="newNote.description"
        rows="4"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      ></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Assigned to</label>
      <div class="mt-1 flex flex-wrap gap-2">
        <label *ngFor="let member of members" class="flex items-center gap-1.5 rounded-full border border-gray-300 px-2.5 py-1 text-xs text-gray-700 has-checked:border-blue-500 has-checked:bg-blue-50">
          <input
            type="checkbox"
            [checked]="newNote.assignedFamilyMemberIds.includes(member.id)"
            (change)="toggleAssignee(member.id)"
            class="h-3.5 w-3.5 rounded border-gray-300"
          />
          {{ member.displayName }}
        </label>
      </div>
    </div>

    <label class="flex items-center gap-2 text-sm text-gray-600">
      <input type="checkbox" name="isImportant" [(ngModel)]="newNote.isImportant" class="rounded border-gray-300" />
      Mark as important
    </label>

    <div class="flex gap-2 pt-1">
      <button type="submit" [disabled]="form.invalid" class="flex-1 rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">
        Add note
      </button>
      <button type="button" (click)="showNewNoteForm = false" class="rounded-md px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100">
        Cancel
      </button>
    </div>
  </form>
</div>

<button
  *ngIf="!showNewNoteForm"
  type="button"
  (click)="showNewNoteForm = true"
  class="fixed bottom-20 right-4 flex h-14 w-14 items-center justify-center rounded-full bg-blue-600 text-2xl text-white shadow-lg hover:bg-blue-500 sm:bottom-6"
  aria-label="Add note"
>+</button>
