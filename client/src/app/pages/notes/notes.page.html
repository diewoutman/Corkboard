<h1 class="text-2xl font-extrabold text-ink">Notes 📌</h1>

<app-error-banner [message]="errorMessage" />

<app-loading-indicator *ngIf="loading" class="mt-8" />

<div *ngIf="!loading" class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  <app-sticky-note-card
    *ngFor="let note of notes; let i = index"
    [note]="note"
    [members]="members"
    [index]="i"
    (toggleImportant)="toggleImportant(note)"
    (delete)="deleteNote(note)"
    (edit)="openEditNoteForm(note)"
  />

  <app-empty-state *ngIf="notes.length === 0" class="col-span-full">No notes here yet.</app-empty-state>
</div>

<app-modal-sheet *ngIf="showNewNoteForm" (dismissed)="closeNoteForm()">
  <form (ngSubmit)="submitNoteForm()" #form="ngForm" class="space-y-3">
    <h2 class="font-heading text-lg font-bold text-ink">{{ editingNote ? 'Edit note' : 'Add note' }}</h2>
    <div>
      <label for="title" class="block text-sm font-bold text-ink">Title</label>
      <input
        id="title"
        name="title"
        [(ngModel)]="newNote.title"
        required
        class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
      />
    </div>
    <div>
      <label for="description" class="block text-sm font-bold text-ink">Note</label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="newNote.description"
        rows="4"
        class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
      ></textarea>
    </div>
    <app-assignee-chip-group [members]="members" [selectedIds]="newNote.assignedFamilyMemberIds" (toggled)="toggleAssignee($event)" />

    <label class="flex items-center gap-2 text-sm font-semibold text-ink-muted">
      <input type="checkbox" name="isImportant" [(ngModel)]="newNote.isImportant" class="rounded-md accent-coral" />
      Mark as important
    </label>

    <div class="flex gap-2 pt-1">
      <button type="submit" [disabled]="form.invalid" class="flex-1 rounded-full bg-coral px-4 py-2 text-sm font-extrabold text-white shadow-button hover:bg-coral-strong disabled:cursor-not-allowed disabled:opacity-50">
        {{ editingNote ? 'Save changes' : 'Add note' }}
      </button>
      <button type="button" (click)="closeNoteForm()" class="rounded-full px-4 py-2 text-sm font-bold text-ink-muted hover:bg-cork">
        Cancel
      </button>
    </div>
  </form>
</app-modal-sheet>

<app-fab-button *ngIf="!showNewNoteForm" label="Add note" (clicked)="openAddNoteForm()" />
