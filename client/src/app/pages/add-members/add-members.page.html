<div class="mx-auto max-w-sm">
  <p class="text-sm font-medium text-gray-500">Step 3 of 3 — Set up Corkboard</p>
  <h1 class="mt-1 text-2xl font-semibold text-gray-900">Add your family</h1>
  <p class="mt-2 text-sm text-gray-600">Add the rest of your family so you can assign notes, tasks, and appointments to them. You can always add more later.</p>

  <ul *ngIf="!loading" class="mt-6 divide-y divide-gray-100 rounded-md border border-gray-200">
    <li *ngFor="let member of members" class="flex items-center gap-3 px-3 py-2">
      <span class="h-6 w-6 shrink-0 rounded-full" [style.background]="member.color"></span>
      <span class="flex-1 text-sm text-gray-900">{{ member.displayName }}</span>
      <button
        type="button"
        (click)="removeMember(member)"
        class="text-sm text-gray-400 hover:text-red-600"
        aria-label="Remove"
      >✕</button>
    </li>
  </ul>

  <form (ngSubmit)="addMember()" #form="ngForm" class="mt-6 space-y-4">
    <div>
      <label for="displayName" class="block text-sm font-medium text-gray-700">Name</label>
      <input
        id="displayName"
        name="displayName"
        placeholder="e.g. Kids, partner, grandparent…"
        [(ngModel)]="displayName"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>
    <div>
      <label for="color" class="block text-sm font-medium text-gray-700">Color</label>
      <input
        id="color"
        type="color"
        name="color"
        [(ngModel)]="color"
        required
        class="mt-1 block h-10 w-16 rounded-md border border-gray-300 shadow-sm"
      />
    </div>

    <button
      type="submit"
      [disabled]="form.invalid || submitting"
      class="w-full rounded-md border border-blue-600 px-4 py-2 text-sm font-semibold text-blue-600 hover:bg-blue-50 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Add family member
    </button>
  </form>

  <p *ngIf="errorMessage" class="mt-4 text-sm text-red-600">{{ errorMessage }}</p>

  <button
    type="button"
    (click)="finish()"
    class="mt-6 w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500"
  >
    Finish setup
  </button>
</div>
