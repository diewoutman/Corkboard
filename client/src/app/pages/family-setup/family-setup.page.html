<div class="mx-auto max-w-sm">
  <p class="text-sm font-medium text-gray-500">Step 2 of 3 — Set up Corkboard</p>
  <h1 class="mt-1 text-2xl font-semibold text-gray-900">Set up your family</h1>
  <p class="mt-2 text-sm text-gray-600">One-time setup — this creates your family and you as its first member.</p>

  <form (ngSubmit)="submit()" #form="ngForm" class="mt-6 space-y-4">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700">Family name</label>
      <input
        id="name"
        name="name"
        placeholder="e.g. The Smiths"
        [(ngModel)]="name"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>
    <div>
      <label for="timeZone" class="block text-sm font-medium text-gray-700">Time zone</label>
      <input
        id="timeZone"
        name="timeZone"
        [(ngModel)]="timeZone"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>
    <div>
      <label for="ownerDisplayName" class="block text-sm font-medium text-gray-700">Your display name</label>
      <input
        id="ownerDisplayName"
        name="ownerDisplayName"
        placeholder="e.g. Wouter"
        [(ngModel)]="ownerDisplayName"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>
    <div>
      <label for="ownerColor" class="block text-sm font-medium text-gray-700">Your color</label>
      <input
        id="ownerColor"
        type="color"
        name="ownerColor"
        [(ngModel)]="ownerColor"
        required
        class="mt-1 block h-10 w-16 rounded-md border border-gray-300 shadow-sm"
      />
    </div>

    <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>

    <button
      type="submit"
      [disabled]="form.invalid || submitting"
      class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Create family
    </button>
  </form>
</div>
