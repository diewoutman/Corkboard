<div class="mx-auto max-w-sm">
  <app-setup-step-header [step]="2" title="Set up your family" description="One-time setup — this creates your family and you as its first member." />

  <form (ngSubmit)="submit()" #form="ngForm" class="mt-6 space-y-4">
    <app-text-input label="Family name" [(ngModel)]="name" name="name" required placeholder="e.g. The Smiths" />
    <app-text-input label="Time zone" [(ngModel)]="timeZone" name="timeZone" required />
    <app-text-input label="Your display name" [(ngModel)]="ownerDisplayName" name="ownerDisplayName" required placeholder="e.g. Wouter" />
    <app-color-picker-field label="Your color" [(value)]="ownerColor" />

    <app-error-banner [message]="errorMessage" />

    <button
      type="submit"
      [disabled]="form.invalid || submitting"
      class="w-full rounded-full bg-coral px-4 py-2 text-sm font-extrabold text-white shadow-button hover:bg-coral-strong disabled:cursor-not-allowed disabled:opacity-50"
    >
      Create family
    </button>
  </form>
</div>
