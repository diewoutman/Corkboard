<div class="flex items-center justify-between gap-2">
  <h1 class="text-2xl font-extrabold text-ink">Today ☀️</h1>
  <a routerLink="/upcoming" class="text-sm font-extrabold text-coral hover:text-coral-strong">Upcoming →</a>
</div>
<p class="mt-1 text-sm font-bold text-ink-muted">{{ todayLabel }}</p>

<div *ngIf="loading" class="mt-8 text-center text-sm font-semibold text-ink-muted">Loading…</div>

<div *ngIf="!loading" class="mt-4 space-y-4">
  <div *ngFor="let group of groups" class="rounded-3xl bg-white p-4 shadow-sticker">
    <div class="mb-2 flex items-center gap-2">
      <span
        *ngIf="group.member"
        class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[11px] font-extrabold text-white"
        [style.background]="group.member.color"
      >{{ group.member.displayName.charAt(0).toUpperCase() }}</span>
      <h2 class="font-heading text-base font-bold text-ink">{{ group.member ? group.member.displayName : 'Unassigned' }}</h2>
    </div>
    <ul class="space-y-1.5">
      <li *ngFor="let item of group.items" class="flex items-center gap-2">
        <input
          *ngIf="item.kind === 'task'; else eventDot"
          type="checkbox"
          (change)="toggleDone(item.task!)"
          class="h-5 w-5 shrink-0 rounded-md accent-coral"
        />
        <ng-template #eventDot><span class="h-2.5 w-2.5 shrink-0 rounded-full bg-wouter"></span></ng-template>
        <span class="truncate text-sm" [class.text-danger]="item.overdue" [class.font-extrabold]="item.overdue" [class.font-semibold]="!item.overdue" [class.text-ink]="!item.overdue">{{ item.title }}</span>
        <span *ngIf="item.overdue" class="shrink-0 rounded-full bg-danger-bg px-2 py-0.5 text-xs font-extrabold text-danger-text">Overdue</span>
        <span *ngIf="item.time" class="ml-auto shrink-0 text-xs font-bold text-ink-muted">{{ item.time | date: 'shortTime' }}</span>
      </li>
    </ul>
  </div>

  <p *ngIf="groups.length === 0" class="rounded-3xl border-2 border-dashed border-border-soft px-4 py-8 text-center text-sm font-semibold text-ink-muted">
    Nothing due today. 🎉
  </p>
</div>
