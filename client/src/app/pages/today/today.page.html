<div class="flex items-center justify-between gap-2">
  <h1 class="text-2xl font-semibold text-gray-900">Today</h1>
  <a routerLink="/upcoming" class="text-sm font-medium text-blue-600 hover:text-blue-500">Upcoming →</a>
</div>
<p class="mt-1 text-sm text-gray-500">{{ todayLabel }}</p>

<div *ngIf="loading" class="mt-8 text-center text-sm text-gray-500">Loading…</div>

<div *ngIf="!loading" class="mt-4 space-y-4">
  <div *ngFor="let group of groups" class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
    <div class="mb-2 flex items-center gap-2">
      <span
        *ngIf="group.member"
        class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-[10px] font-semibold text-white"
        [style.background]="group.member.color"
      >{{ group.member.displayName.charAt(0).toUpperCase() }}</span>
      <h2 class="text-sm font-semibold text-gray-900">{{ group.member ? group.member.displayName : 'Unassigned' }}</h2>
    </div>
    <ul class="space-y-1.5">
      <li *ngFor="let item of group.items" class="flex items-center gap-2">
        <input
          *ngIf="item.kind === 'task'; else eventDot"
          type="checkbox"
          (change)="toggleDone(item.task!)"
          class="h-4 w-4 shrink-0 rounded border-gray-300"
        />
        <ng-template #eventDot><span class="h-2 w-2 shrink-0 rounded-full bg-blue-400"></span></ng-template>
        <span class="truncate text-sm" [class.text-red-600]="item.overdue" [class.font-semibold]="item.overdue" [class.text-gray-900]="!item.overdue">{{ item.title }}</span>
        <span *ngIf="item.overdue" class="shrink-0 rounded-full bg-red-50 px-2 py-0.5 text-xs font-semibold text-red-600">Overdue</span>
        <span *ngIf="item.time" class="ml-auto shrink-0 text-xs text-gray-400">{{ item.time | date: 'shortTime' }}</span>
      </li>
    </ul>
  </div>

  <p *ngIf="groups.length === 0" class="rounded-lg border border-dashed border-gray-300 px-4 py-8 text-center text-sm text-gray-500">
    Nothing due today. 🎉
  </p>
</div>
