<div class="mx-auto max-w-sm">
  <ng-container *ngIf="isFirstRun">
    <p class="text-sm font-medium text-gray-500">Step 1 of 3 — Set up Corkboard</p>
    <h1 class="mt-1 text-2xl font-semibold text-gray-900">Welcome! Let's create your account</h1>
    <p class="mt-2 text-sm text-gray-600">Nobody's set up this Corkboard yet. Create your account first — you'll set up your family next.</p>
  </ng-container>

  <h1 *ngIf="!isFirstRun" class="text-2xl font-semibold text-gray-900">Log in</h1>

  <form (ngSubmit)="submit()" #form="ngForm" class="mt-6 space-y-4">
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        autocomplete="email"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        minlength="6"
        [autocomplete]="isFirstRun ? 'new-password' : 'current-password'"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>

    <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>

    <button
      type="submit"
      [disabled]="form.invalid || submitting"
      class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ isFirstRun ? 'Create account and continue' : 'Log in' }}
    </button>
  </form>

  <button
    *ngIf="!isProduction"
    type="button"
    [disabled]="submitting"
    (click)="seedAndLogIn()"
    class="mt-4 w-full rounded-md border border-dashed border-gray-300 px-4 py-2 text-sm font-semibold text-gray-500 hover:border-gray-400 hover:text-gray-700 disabled:cursor-not-allowed disabled:opacity-50"
  >
    Seed test data &amp; log in (dev only)
  </button>
</div>
