<a routerLink="/tasks" class="text-sm font-medium text-blue-600 hover:text-blue-500">← Lists</a>

<div class="mt-2 flex items-center justify-between">
  <h1 class="text-2xl font-semibold text-gray-900">{{ list?.name ?? 'Loading…' }}</h1>
  <label class="flex items-center gap-2 text-sm text-gray-600">
    <input type="checkbox" [(ngModel)]="showCompleted" name="showCompleted" class="rounded border-gray-300" />
    Show completed
  </label>
</div>

<p *ngIf="errorMessage" class="mt-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage }}</p>

<div *ngIf="loading" class="mt-8 text-center text-sm text-gray-500">Loading…</div>

<div *ngIf="!loading" class="mt-4 space-y-4">
  <div *ngFor="let group of groupedTasks">
    <h2 *ngIf="groupedTasks.length > 1" class="mb-1.5 text-xs font-semibold uppercase tracking-wide text-gray-400">
      {{ group.category ?? 'Other' }}
    </h2>
    <ul class="space-y-2">
      <li
        *ngFor="let task of group.tasks"
        class="flex items-start gap-3 rounded-lg border border-gray-200 bg-white px-4 py-3 shadow-sm"
      >
        <input
          type="checkbox"
          [checked]="!!task.isCompleted"
          (change)="toggleDone(task)"
          class="mt-1 h-4 w-4 shrink-0 rounded border-gray-300 text-blue-600"
        />
        <div class="min-w-0 flex-1">
          <p class="truncate font-medium text-gray-900" [class.line-through]="task.isCompleted" [class.text-gray-400]="task.isCompleted">
            {{ task.title }}
          </p>
          <p *ngIf="task.description" class="mt-0.5 text-sm text-gray-500">{{ task.description }}</p>
          <div class="mt-1 flex flex-wrap items-center gap-2">
            <span *ngIf="task.until" class="text-xs font-medium text-gray-500">
              Due {{ task.until | date: 'mediumDate' }}
            </span>
            <span
              *ngFor="let memberId of task.assignedFamilyMemberIds"
              class="rounded-full px-2 py-0.5 text-xs font-medium text-white"
              [style.background]="memberColor(memberId)"
            >{{ memberName(memberId) }}</span>
          </div>
        </div>
        <button type="button" (click)="deleteTask(task)" class="shrink-0 text-gray-300 hover:text-red-600" aria-label="Delete">✕</button>
      </li>
    </ul>
  </div>

  <p *ngIf="visibleTasks.length === 0" class="rounded-lg border border-dashed border-gray-300 px-4 py-8 text-center text-sm text-gray-500">
    No tasks here yet.
  </p>
</div>

<div *ngIf="showNewTaskForm" class="mt-4 rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
  <form (ngSubmit)="submitNewTask()" #form="ngForm" class="space-y-3">
    <div>
      <label for="title" class="block text-sm font-medium text-gray-700">Task</label>
      <input
        id="title"
        name="title"
        [(ngModel)]="newTask.title"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>
    <div>
      <label for="description" class="block text-sm font-medium text-gray-700">Notes</label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="newTask.description"
        rows="2"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      ></textarea>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label for="dueDate" class="block text-sm font-medium text-gray-700">Due date</label>
        <input
          id="dueDate"
          type="date"
          name="dueDate"
          [(ngModel)]="newTask.dueDate"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
        />
      </div>
      <div>
        <label for="priority" class="block text-sm font-medium text-gray-700">Priority</label>
        <select
          id="priority"
          name="priority"
          [(ngModel)]="newTask.priority"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
        >
          <option [ngValue]="null">None</option>
          <option [ngValue]="1">Low</option>
          <option [ngValue]="2">Medium</option>
          <option [ngValue]="3">High</option>
        </select>
      </div>
    </div>
    <div>
      <label for="category" class="block text-sm font-medium text-gray-700">Category <span class="text-gray-400">(optional — groups the list, e.g. for a shopping list)</span></label>
      <input
        id="category"
        name="category"
        list="knownCategories"
        placeholder="e.g. Produce, Dairy, Household…"
        [(ngModel)]="newTask.category"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
      <datalist id="knownCategories">
        <option *ngFor="let category of knownCategories" [value]="category"></option>
      </datalist>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Assigned to</label>
      <div class="mt-1 flex flex-wrap gap-2">
        <label *ngFor="let member of members" class="flex items-center gap-1.5 rounded-full border border-gray-300 px-2.5 py-1 text-xs text-gray-700 has-checked:border-blue-500 has-checked:bg-blue-50">
          <input
            type="checkbox"
            [checked]="newTask.assignedFamilyMemberIds.includes(member.id)"
            (change)="toggleAssignee(member.id)"
            class="h-3.5 w-3.5 rounded border-gray-300"
          />
          {{ member.displayName }}
        </label>
      </div>
    </div>

    <div class="flex gap-2 pt-1">
      <button type="submit" [disabled]="form.invalid" class="flex-1 rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">
        Add task
      </button>
      <button type="button" (click)="showNewTaskForm = false" class="rounded-md px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100">
        Cancel
      </button>
    </div>
  </form>
</div>

<button
  *ngIf="!showNewTaskForm"
  type="button"
  (click)="showNewTaskForm = true"
  class="fixed bottom-20 right-4 flex h-14 w-14 items-center justify-center rounded-full bg-blue-600 text-2xl text-white shadow-lg hover:bg-blue-500 sm:bottom-6"
  aria-label="Add task"
>+</button>
