<h1 class="text-2xl font-semibold text-gray-900">Lists</h1>

<p *ngIf="errorMessage" class="mt-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage }}</p>

<div *ngIf="loading" class="mt-8 text-center text-sm text-gray-500">Loading…</div>

<ul *ngIf="!loading" class="mt-4 space-y-2">
  <li *ngFor="let list of lists">
    <a
      [routerLink]="['/tasks', list.id]"
      class="flex items-center justify-between rounded-lg border border-gray-200 bg-white px-4 py-3 shadow-sm hover:border-blue-300 hover:bg-blue-50/40"
    >
      <span class="font-medium text-gray-900">{{ list.name }}</span>
      <span *ngIf="list.nodeCount > 0" class="text-sm text-gray-500">
        {{ list.incompleteCount }} of {{ list.nodeCount }} left
      </span>
      <span *ngIf="list.nodeCount === 0" class="text-sm text-gray-400">Empty</span>
    </a>
  </li>

  <li *ngIf="lists.length === 0" class="rounded-lg border border-dashed border-gray-300 px-4 py-8 text-center text-sm text-gray-500">
    No lists yet — create one to start adding tasks.
  </li>
</ul>

<div *ngIf="showNewListForm" class="mt-4 rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
  <form (ngSubmit)="submitNewList()" #form="ngForm" class="flex items-end gap-2">
    <div class="flex-1">
      <label for="listName" class="block text-sm font-medium text-gray-700">List name</label>
      <input
        id="listName"
        name="listName"
        placeholder="e.g. Groceries, Chores…"
        [(ngModel)]="newListName"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>
    <button type="submit" [disabled]="form.invalid || submitting" class="rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">
      Create
    </button>
    <button type="button" (click)="showNewListForm = false" class="rounded-md px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100">
      Cancel
    </button>
  </form>
</div>

<button
  *ngIf="!showNewListForm"
  type="button"
  (click)="showNewListForm = true"
  class="fixed bottom-20 right-4 flex h-14 w-14 items-center justify-center rounded-full bg-blue-600 text-2xl text-white shadow-lg hover:bg-blue-500 sm:bottom-6"
  aria-label="Add list"
>+</button>
