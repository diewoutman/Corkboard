<div class="flex items-center justify-between gap-2">
  <h1 class="text-2xl font-semibold text-gray-900">Upcoming</h1>
  <a routerLink="/today" class="text-sm font-medium text-blue-600 hover:text-blue-500">← Today</a>
</div>
<p class="mt-1 text-sm text-gray-500">The next 7 days.</p>

<div *ngIf="loading" class="mt-8 text-center text-sm text-gray-500">Loading…</div>

<div *ngIf="!loading" class="mt-4 space-y-4">
  <div *ngIf="overdue.length > 0" class="rounded-lg border border-red-200 bg-red-50 p-4">
    <h2 class="mb-2 text-sm font-semibold text-red-700">Overdue</h2>
    <ul class="space-y-1.5">
      <li *ngFor="let item of overdue" class="flex items-center gap-2">
        <input type="checkbox" (change)="toggleDone(item.task!)" class="h-4 w-4 shrink-0 rounded border-gray-300" />
        <span class="truncate text-sm font-semibold text-red-700">{{ item.title }}</span>
        <app-member-avatars class="ml-auto shrink-0" [members]="members" [assignedIds]="item.assignedFamilyMemberIds"></app-member-avatars>
        <span *ngIf="item.time" class="shrink-0 text-xs text-red-500">{{ item.time | date: 'mediumDate' }}</span>
      </li>
    </ul>
  </div>

  <div *ngFor="let day of days" class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
    <h2 class="mb-2 flex items-baseline gap-2 text-sm font-semibold text-gray-900">
      {{ day.label }}
      <span class="text-xs font-normal text-gray-400">{{ day.date | date: 'MMM d' }}</span>
    </h2>
    <ul *ngIf="day.items.length > 0; else noItems" class="space-y-1.5">
      <li *ngFor="let item of day.items" class="flex items-center gap-2">
        <input
          *ngIf="item.kind === 'task'; else eventDot"
          type="checkbox"
          (change)="toggleDone(item.task!)"
          class="h-4 w-4 shrink-0 rounded border-gray-300"
        />
        <ng-template #eventDot><span class="h-2 w-2 shrink-0 rounded-full bg-blue-400"></span></ng-template>
        <span class="truncate text-sm text-gray-900">{{ item.title }}</span>
        <app-member-avatars class="ml-auto shrink-0" [members]="members" [assignedIds]="item.assignedFamilyMemberIds"></app-member-avatars>
        <span *ngIf="item.time" class="shrink-0 text-xs text-gray-400">{{ item.time | date: 'shortTime' }}</span>
      </li>
    </ul>
    <ng-template #noItems>
      <p class="text-sm text-gray-400">Nothing planned.</p>
    </ng-template>
  </div>
</div>
