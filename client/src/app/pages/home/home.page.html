<div>
  <h1 class="text-2xl font-semibold text-gray-900">
    {{ familyName ? familyName : 'Welcome' }}
  </h1>
  <p class="mt-1 text-sm text-gray-500">What do you want to look at?</p>
</div>

<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
  <a
    *ngFor="let tile of tiles"
    [routerLink]="tile.route"
    class="flex flex-col gap-3 rounded-lg border border-gray-200 bg-white p-5 shadow-sm transition hover:border-blue-300 hover:shadow-md"
  >
    <span class="flex h-10 w-10 items-center justify-center rounded-md bg-blue-50 text-blue-600">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="tile.icon" />
      </svg>
    </span>
    <div>
      <h2 class="font-medium text-gray-900">{{ tile.title }}</h2>
      <p class="mt-0.5 text-sm text-gray-500">{{ tile.description }}</p>
    </div>
  </a>
</div>
