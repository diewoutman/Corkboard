<div>
  <h1 class="text-2xl font-extrabold text-ink">{{ familyName ? familyName : 'Welcome' }} 👋</h1>
  <p class="mt-1 text-sm font-semibold text-ink-muted">Drag widgets to reorder them, or use ↔ to resize.</p>
</div>

<p *ngIf="errorMessage" class="mt-4 rounded-2xl bg-danger-bg px-3 py-2 text-sm font-semibold text-danger-text">{{ errorMessage }}</p>

<div *ngIf="loading" class="mt-8 text-center text-sm font-semibold text-ink-muted">Loading…</div>

<div *ngIf="!loading && widgets.length === 0" class="mt-6 rounded-3xl border-2 border-dashed border-border-soft px-4 py-8 text-center text-sm font-semibold text-ink-muted">
  Your dashboard is empty — add a widget to get started.
</div>

<div
  *ngIf="!loading && widgets.length > 0"
  cdkDropList
  [cdkDropListData]="widgets"
  (cdkDropListDropped)="drop($event)"
  class="mt-6 grid grid-cols-1 items-start gap-4 sm:grid-cols-3"
>
  <div *ngFor="let widget of widgets" cdkDrag [ngClass]="widgetSpanClass(widget)" class="rounded-3xl bg-white p-4 shadow-sticker">
    <div cdkDragHandle class="mb-2 flex cursor-grab items-center justify-between gap-2 active:cursor-grabbing">
      <h2 class="font-heading text-base font-bold text-ink">{{ widgetTitle(widget) }}</h2>
      <div class="flex items-center gap-2.5">
        <button type="button" (click)="cycleWidgetWidth(widget)" class="text-ink-muted hover:text-coral" aria-label="Resize widget" title="Resize widget">↔</button>
        <button type="button" (click)="openEditWidgetForm(widget)" class="text-xs font-bold text-coral hover:text-coral-strong" aria-label="Configure widget" title="Configure widget">⚙</button>
        <button type="button" (click)="removeWidget(widget)" class="text-ink-muted hover:text-danger" aria-label="Remove widget" title="Remove widget">✕</button>
      </div>
    </div>

    <app-navigation-widget *ngIf="widget.type === 'Navigation'" [tileOrder]="widget.tileOrder"></app-navigation-widget>
    <app-notes-widget *ngIf="widget.type === 'Notes'" [importantOnly]="widget.importantOnly"></app-notes-widget>
    <app-tasks-widget
      *ngIf="widget.type === 'Tasks'"
      [collectionId]="widget.collectionId"
      [assignedToMeOnly]="widget.assignedToMeOnly"
    ></app-tasks-widget>
    <app-today-widget *ngIf="widget.type === 'Today'"></app-today-widget>
  </div>
</div>

<div *ngIf="showWidgetForm" class="fixed inset-0 z-20 flex items-end justify-center bg-ink/30 sm:items-center" (click)="cancelWidgetForm()">
  <div class="max-h-[85vh] w-full max-w-md overflow-y-auto rounded-t-3xl bg-white p-4 shadow-sticker sm:rounded-3xl" (click)="$event.stopPropagation()">
    <form (ngSubmit)="submitWidgetForm()" #form="ngForm" class="space-y-3">
      <h2 class="font-heading text-lg font-bold text-ink">{{ editingWidgetId ? 'Configure widget' : 'Add a widget' }}</h2>

      <div *ngIf="!editingWidgetId">
        <label for="widgetType" class="block text-sm font-bold text-ink">Type</label>
        <select
          id="widgetType"
          name="widgetType"
          [(ngModel)]="widgetForm.type"
          class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
        >
          <option value="Navigation">Navigation</option>
          <option value="Notes">Notes</option>
          <option value="Tasks">Tasks</option>
          <option value="Today">Today</option>
        </select>
      </div>

      <div *ngIf="widgetForm.type === 'Navigation'">
        <label class="block text-sm font-bold text-ink">Tile order <span class="font-semibold text-ink-muted">(drag to reorder)</span></label>
        <ul cdkDropList (cdkDropListDropped)="dropTile($event)" class="mt-1 space-y-1">
          <li
            *ngFor="let key of widgetForm.tileOrder"
            cdkDrag
            class="flex cursor-grab items-center gap-2 rounded-xl bg-cork px-3 py-2 text-sm font-semibold text-ink active:cursor-grabbing"
          >
            ⠿ {{ tileTitle(key) }}
          </li>
        </ul>
      </div>

      <label *ngIf="widgetForm.type === 'Notes'" class="flex items-center gap-2 text-sm font-semibold text-ink-muted">
        <input type="checkbox" name="importantOnly" [(ngModel)]="widgetForm.importantOnly" class="rounded-md accent-coral" />
        Only show notes marked important
      </label>

      <div *ngIf="widgetForm.type === 'Tasks'" class="space-y-2">
        <label class="flex items-center gap-2 text-sm font-semibold text-ink">
          <input type="radio" name="taskMode" value="assignedToMe" [(ngModel)]="widgetForm.taskMode" class="accent-coral" />
          Everything assigned to me
        </label>
        <label class="flex items-center gap-2 text-sm font-semibold text-ink">
          <input type="radio" name="taskMode" value="list" [(ngModel)]="widgetForm.taskMode" class="accent-coral" />
          A specific list
        </label>
        <select
          *ngIf="widgetForm.taskMode === 'list'"
          name="taskCollectionId"
          [(ngModel)]="widgetForm.collectionId"
          required
          class="block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
        >
          <option value="" disabled>Choose a list…</option>
          <option *ngFor="let list of taskLists" [value]="list.id">{{ list.name }}</option>
        </select>
      </div>

      <div class="flex gap-2 pt-1">
        <button type="submit" [disabled]="form.invalid" class="flex-1 rounded-full bg-coral px-4 py-2 text-sm font-extrabold text-white shadow-button hover:bg-coral-strong disabled:cursor-not-allowed disabled:opacity-50">
          {{ editingWidgetId ? 'Save changes' : 'Add widget' }}
        </button>
        <button type="button" (click)="cancelWidgetForm()" class="rounded-full px-4 py-2 text-sm font-bold text-ink-muted hover:bg-cork">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>

<button
  *ngIf="!showWidgetForm"
  type="button"
  (click)="openAddWidgetForm()"
  class="fixed bottom-20 right-4 flex h-14 w-14 items-center justify-center rounded-full bg-coral text-2xl text-white shadow-button hover:bg-coral-strong sm:bottom-6"
  aria-label="Add widget"
>+</button>
