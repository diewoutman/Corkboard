<div class="flex items-center justify-between gap-2">
  <div>
    <h1 class="text-2xl font-semibold text-gray-900">{{ familyName ? familyName : 'Welcome' }}</h1>
    <p class="mt-1 text-sm text-gray-500">Drag widgets to reorder your dashboard.</p>
  </div>
  <button
    type="button"
    (click)="openAddWidgetForm()"
    class="rounded-md border border-gray-300 px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50"
  >+ Add widget</button>
</div>

<p *ngIf="errorMessage" class="mt-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage }}</p>

<div *ngIf="loading" class="mt-8 text-center text-sm text-gray-500">Loading…</div>

<div
  *ngIf="!loading"
  cdkDropList
  [cdkDropListData]="widgets"
  (cdkDropListDropped)="drop($event)"
  class="mt-6 grid grid-cols-1 items-start gap-4 sm:grid-cols-2 lg:grid-cols-3"
>
  <div *ngFor="let widget of widgets" cdkDrag class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
    <div cdkDragHandle class="mb-2 flex cursor-grab items-center justify-between gap-2 active:cursor-grabbing">
      <h2 class="text-sm font-semibold text-gray-900">{{ widgetTitle(widget) }}</h2>
      <div class="flex items-center gap-2">
        <button type="button" (click)="openEditWidgetForm(widget)" class="text-xs font-medium text-blue-600 hover:text-blue-500" aria-label="Configure widget">⚙</button>
        <button type="button" (click)="removeWidget(widget)" class="text-gray-400 hover:text-red-600" aria-label="Remove widget">✕</button>
      </div>
    </div>

    <app-navigation-widget *ngIf="widget.type === 'Navigation'" [tileOrder]="widget.tileOrder"></app-navigation-widget>
    <app-notes-widget *ngIf="widget.type === 'Notes'" [importantOnly]="widget.importantOnly"></app-notes-widget>
    <app-tasks-widget
      *ngIf="widget.type === 'Tasks'"
      [collectionId]="widget.collectionId"
      [assignedToMeOnly]="widget.assignedToMeOnly"
    ></app-tasks-widget>
  </div>

  <div *ngIf="widgets.length === 0" class="col-span-full rounded-lg border border-dashed border-gray-300 px-4 py-8 text-center text-sm text-gray-500">
    Your dashboard is empty — add a widget to get started.
  </div>
</div>

<div *ngIf="showWidgetForm" class="fixed inset-0 z-20 flex items-end justify-center bg-black/30 sm:items-center" (click)="cancelWidgetForm()">
  <div class="max-h-[85vh] w-full max-w-md overflow-y-auto rounded-t-lg bg-white p-4 shadow-lg sm:rounded-lg" (click)="$event.stopPropagation()">
    <form (ngSubmit)="submitWidgetForm()" #form="ngForm" class="space-y-3">
      <h2 class="font-medium text-gray-900">{{ editingWidgetId ? 'Configure widget' : 'Add a widget' }}</h2>

      <div *ngIf="!editingWidgetId">
        <label for="widgetType" class="block text-sm font-medium text-gray-700">Type</label>
        <select
          id="widgetType"
          name="widgetType"
          [(ngModel)]="widgetForm.type"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
        >
          <option value="Navigation">Navigation</option>
          <option value="Notes">Notes</option>
          <option value="Tasks">Tasks</option>
        </select>
      </div>

      <div *ngIf="widgetForm.type === 'Navigation'">
        <label class="block text-sm font-medium text-gray-700">Tile order <span class="text-gray-400">(drag to reorder)</span></label>
        <ul cdkDropList (cdkDropListDropped)="dropTile($event)" class="mt-1 space-y-1">
          <li
            *ngFor="let key of widgetForm.tileOrder"
            cdkDrag
            class="flex cursor-grab items-center gap-2 rounded-md border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-700 active:cursor-grabbing"
          >
            ⠿ {{ tileTitle(key) }}
          </li>
        </ul>
      </div>

      <label *ngIf="widgetForm.type === 'Notes'" class="flex items-center gap-2 text-sm text-gray-600">
        <input type="checkbox" name="importantOnly" [(ngModel)]="widgetForm.importantOnly" class="rounded border-gray-300" />
        Only show notes marked important
      </label>

      <div *ngIf="widgetForm.type === 'Tasks'" class="space-y-2">
        <label class="flex items-center gap-2 text-sm text-gray-700">
          <input type="radio" name="taskMode" value="assignedToMe" [(ngModel)]="widgetForm.taskMode" />
          Everything assigned to me
        </label>
        <label class="flex items-center gap-2 text-sm text-gray-700">
          <input type="radio" name="taskMode" value="list" [(ngModel)]="widgetForm.taskMode" />
          A specific list
        </label>
        <select
          *ngIf="widgetForm.taskMode === 'list'"
          name="taskCollectionId"
          [(ngModel)]="widgetForm.collectionId"
          required
          class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
        >
          <option value="" disabled>Choose a list…</option>
          <option *ngFor="let list of taskLists" [value]="list.id">{{ list.name }}</option>
        </select>
      </div>

      <div class="flex gap-2 pt-1">
        <button type="submit" [disabled]="form.invalid" class="flex-1 rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50">
          {{ editingWidgetId ? 'Save changes' : 'Add widget' }}
        </button>
        <button type="button" (click)="cancelWidgetForm()" class="rounded-md px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
