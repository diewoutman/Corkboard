<div *ngIf="loading" class="text-sm text-gray-500">Loading…</div>

<ul *ngIf="!loading" class="space-y-2">
  <li *ngFor="let note of notes" class="rounded-md border border-gray-100 bg-yellow-50 px-2.5 py-1.5">
    <p class="flex items-center gap-1 truncate text-sm font-medium text-gray-900">
      <span *ngIf="note.isImportant" class="text-amber-500">★</span>
      {{ note.title }}
      <app-member-avatars class="ml-auto shrink-0" [members]="members" [assignedIds]="note.assignedFamilyMemberIds"></app-member-avatars>
    </p>
    <p *ngIf="note.description" class="truncate text-xs text-gray-600">{{ note.description }}</p>
  </li>
  <li *ngIf="notes.length === 0" class="text-sm text-gray-500">
    {{ importantOnly ? 'No important notes.' : 'No notes yet.' }}
  </li>
</ul>

<a routerLink="/notes" class="mt-3 inline-block text-xs font-medium text-blue-600 hover:text-blue-500">View all notes →</a>
