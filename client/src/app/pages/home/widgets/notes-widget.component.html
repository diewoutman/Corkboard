<div *ngIf="loading" class="text-sm font-semibold text-ink-muted">Loading…</div>

<ul *ngIf="!loading" class="space-y-2">
  <li *ngFor="let note of notes; let i = index" [ngClass]="[noteColor(i), noteRotation(i)]" class="rounded-2xl px-2.5 py-1.5 shadow-sm">
    <p class="flex items-center gap-1 truncate text-sm font-bold text-ink">
      <span *ngIf="note.isImportant" class="text-coral">★</span>
      {{ note.title }}
      <app-member-avatars class="ml-auto shrink-0" [members]="members" [assignedIds]="note.assignedFamilyMemberIds"></app-member-avatars>
    </p>
    <p *ngIf="note.description" class="truncate text-xs font-semibold text-ink-muted">{{ note.description }}</p>
  </li>
  <li *ngIf="notes.length === 0" class="text-sm font-semibold text-ink-muted">
    {{ importantOnly ? 'No important notes.' : 'No notes yet.' }}
  </li>
</ul>

<a routerLink="/notes" class="mt-3 inline-block text-xs font-extrabold text-coral hover:text-coral-strong">View all notes →</a>
