<p *ngIf="listName" class="-mt-1 mb-2 text-xs text-gray-500">{{ listName }}</p>
<p *ngIf="!listName && assignedToMeOnly" class="-mt-1 mb-2 text-xs text-gray-500">Assigned to me</p>

<div *ngIf="loading" class="text-sm text-gray-500">Loading…</div>

<ul *ngIf="!loading" class="space-y-1.5">
  <li *ngFor="let task of tasks" class="flex items-center gap-2">
    <input type="checkbox" (change)="toggleDone(task)" class="h-4 w-4 shrink-0 rounded border-gray-300" />
    <span class="truncate text-sm text-gray-900">{{ task.title }}</span>
    <span *ngIf="task.until" class="ml-auto shrink-0 text-xs text-gray-400">{{ task.until | date: 'MMM d' }}</span>
  </li>
  <li *ngIf="tasks.length === 0" class="text-sm text-gray-500">Nothing here.</li>
</ul>

<a [routerLink]="collectionId ? ['/tasks', collectionId] : ['/tasks']" class="mt-3 inline-block text-xs font-medium text-blue-600 hover:text-blue-500">View all →</a>
