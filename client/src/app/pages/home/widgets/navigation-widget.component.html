<div class="grid grid-cols-2 gap-2.5">
  <a
    *ngFor="let tile of tiles; let i = index"
    [routerLink]="tile.route"
    [ngClass]="tileColor(i)"
    class="flex flex-col items-center gap-1.5 rounded-2xl p-4 text-center shadow-sticker-sm transition hover:brightness-105"
  >
    <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="tile.icon" />
    </svg>
    <p class="text-xs font-extrabold text-white">{{ tile.title }}</p>
  </a>
</div>
