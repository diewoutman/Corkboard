<div *ngIf="loading" class="text-sm font-semibold text-ink-muted">Loading…</div>

<div *ngIf="!loading" class="space-y-3">
  <div *ngFor="let group of groups">
    <div class="mb-1 flex items-center gap-1.5">
      <span
        *ngIf="group.member"
        class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-[10px] font-extrabold text-white"
        [style.background]="group.member.color"
      >{{ group.member.displayName.charAt(0).toUpperCase() }}</span>
      <p class="text-xs font-extrabold text-ink">{{ group.member ? group.member.displayName : 'Unassigned' }}</p>
    </div>
    <ul class="space-y-1">
      <li *ngFor="let item of group.items" class="flex items-center gap-2 pl-1">
        <input
          *ngIf="item.kind === 'task'; else eventDot"
          type="checkbox"
          (change)="toggleDone(item.task!)"
          class="h-4 w-4 shrink-0 rounded-md accent-coral"
        />
        <ng-template #eventDot><span class="h-2 w-2 shrink-0 rounded-full bg-wouter"></span></ng-template>
        <span class="truncate text-sm" [class.text-danger]="item.overdue" [class.font-extrabold]="item.overdue" [class.font-semibold]="!item.overdue" [class.text-ink]="!item.overdue">{{ item.title }}</span>
        <span *ngIf="item.overdue" class="shrink-0 rounded-full bg-danger px-2 py-0.5 text-xs font-extrabold text-white">Overdue</span>
        <span *ngIf="item.time" class="ml-auto shrink-0 text-xs font-bold text-ink-muted">{{ item.time | date: 'shortTime' }}</span>
      </li>
    </ul>
  </div>

  <p *ngIf="groups.length === 0" class="text-sm font-semibold text-ink-muted">Nothing due today. 🎉</p>
</div>
