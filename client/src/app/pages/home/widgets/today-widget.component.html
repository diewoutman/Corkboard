<div *ngIf="loading" class="text-sm text-gray-500">Loading…</div>

<div *ngIf="!loading" class="space-y-3">
  <div *ngFor="let group of groups">
    <div class="mb-1 flex items-center gap-1.5">
      <span
        *ngIf="group.member"
        class="flex h-4 w-4 shrink-0 items-center justify-center rounded-full text-[9px] font-semibold text-white"
        [style.background]="group.member.color"
      >{{ group.member.displayName.charAt(0).toUpperCase() }}</span>
      <p class="text-xs font-semibold text-gray-600">{{ group.member ? group.member.displayName : 'Unassigned' }}</p>
    </div>
    <ul class="space-y-1">
      <li *ngFor="let item of group.items" class="flex items-center gap-2 pl-1">
        <input
          *ngIf="item.kind === 'task'; else eventDot"
          type="checkbox"
          (change)="toggleDone(item.task!)"
          class="h-3.5 w-3.5 shrink-0 rounded border-gray-300"
        />
        <ng-template #eventDot><span class="h-1.5 w-1.5 shrink-0 rounded-full bg-blue-400"></span></ng-template>
        <span class="truncate text-sm text-gray-900">{{ item.title }}</span>
        <span *ngIf="item.time" class="ml-auto shrink-0 text-xs text-gray-400">{{ item.time | date: 'shortTime' }}</span>
      </li>
    </ul>
  </div>

  <p *ngIf="groups.length === 0" class="text-sm text-gray-500">Nothing due today. 🎉</p>
</div>
