<h1 class="text-xl font-bold text-white">Stats</h1>

<p *ngIf="errorMessage" class="mt-4 rounded-lg bg-rose-950 px-3 py-2 text-sm font-semibold text-rose-300">{{ errorMessage }}</p>

<p *ngIf="loading" class="mt-6 text-sm font-semibold text-slate-400">Loading…</p>

<div *ngIf="!loading" class="mt-6 grid grid-cols-2 gap-4 sm:grid-cols-3">
  <div *ngFor="let tile of tiles" class="rounded-lg border border-slate-700 bg-slate-800 p-4">
    <p class="text-3xl font-bold text-white">{{ tile.value }}</p>
    <p class="mt-1 text-xs font-semibold uppercase tracking-wide text-slate-400">{{ tile.label }}</p>
  </div>
</div>
