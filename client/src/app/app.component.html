<div class="flex min-h-screen flex-col" [class.bg-cork]="!isAdminRoute">
  <header *ngIf="!isAdminRoute" class="sticky top-0 z-20 bg-white">
    <div class="mx-auto flex max-w-screen-2xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
      <div class="flex items-center gap-2">
        <a routerLink="/home" class="flex items-center gap-2 font-heading text-xl font-extrabold text-coral">
          <img src="assets/icon/qorkboard-mark.svg" alt="" width="28" height="28" class="rounded-lg" />
          Qorkboard
        </a>
        <span
          *ngIf="auth.hasFamily()"
          class="rounded-full bg-badge-bg px-2.5 py-0.5 text-[10px] font-extrabold text-badge-text"
          [title]="auth.isOwner() ? 'Owner: can manage family members and create logins for them' : 'Everyone with a login sees this family\'s full Tasks, Notes and Calendar — there is no per-list restriction'"
        >{{ auth.role() }}</span>
      </div>

      <div *ngIf="auth.hasFamily()" class="flex items-center gap-4">
        <nav class="hidden items-center gap-4 text-sm font-bold text-ink-muted sm:flex">
          <a
            *ngFor="let group of navGroups"
            [routerLink]="group.route"
            class="rounded-md px-1 py-1.5 hover:text-coral"
            [class.text-coral]="isGroupActive(group)"
          >{{ group.label }}</a>
        </nav>

        <div class="relative">
          <button
            type="button"
            (click)="toggleAccountMenu()"
            class="flex h-8 w-8 items-center justify-center rounded-full bg-badge-bg text-ink-muted hover:text-coral"
            aria-label="Account menu"
          >
            <app-icon [path]="accountIcon" sizeClass="h-5 w-5" />
          </button>
          <div
            *ngIf="accountMenuOpen"
            class="absolute right-0 top-full mt-2 min-w-[8rem] rounded-xl border border-border-soft bg-white py-1 shadow-sticker-sm"
          >
            <a
              *ngIf="auth.isSystemOwner()"
              routerLink="/admin"
              class="block w-full px-4 py-2 text-left text-sm font-bold text-ink-muted hover:text-coral"
            >Admin console</a>
            <button
              type="button"
              (click)="logout()"
              class="block w-full px-4 py-2 text-left text-sm font-bold text-ink-muted hover:text-coral"
            >Log out</button>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="auth.hasFamily() && inDailyGroup" class="border-t border-border-soft">
      <div class="mx-auto flex max-w-screen-2xl gap-2 px-4 py-2 sm:px-6 lg:px-8">
        <a
          *ngFor="let child of dailyChildren"
          [routerLink]="child.route"
          routerLinkActive="bg-coral text-white"
          class="rounded-full px-3 py-1 text-xs font-extrabold text-ink-muted"
        >{{ child.label }}</a>
      </div>
    </div>
  </header>

  <main [class]="isAdminRoute ? 'flex-1' : 'mx-auto w-full max-w-screen-2xl flex-1 px-4 py-6 sm:px-6 lg:px-8'" [class.pb-20]="!isAdminRoute && auth.hasFamily()">
    <router-outlet></router-outlet>
  </main>

  <nav
    *ngIf="!isAdminRoute && auth.hasFamily()"
    class="fixed inset-x-0 bottom-0 z-10 flex border-t border-border-soft bg-white sm:hidden"
  >
    <a
      *ngFor="let group of navGroups"
      [routerLink]="group.route"
      class="relative flex flex-1 flex-col items-center gap-0.5 py-2.5 text-xs font-bold text-ink-muted"
      [class.text-coral]="isGroupActive(group)"
    >
      <span class="relative">
        <app-icon [path]="group.icon" sizeClass="h-5 w-5" />
        <span *ngIf="group.key === 'home' && dueTodayCount > 0" class="absolute -right-1.5 -top-1 flex h-3.5 w-3.5 items-center justify-center rounded-full bg-danger text-[9px] font-extrabold text-white">{{ dueTodayCount > 9 ? '9+' : dueTodayCount }}</span>
      </span>
      {{ group.label }}
    </a>
  </nav>
</div>
