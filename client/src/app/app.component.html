<div class="flex min-h-screen flex-col">
  <header class="sticky top-0 z-10 border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
      <span class="text-lg font-semibold text-gray-900">Corkboard</span>

      <nav *ngIf="auth.hasFamily()" class="hidden items-center gap-1 sm:flex">
        <a
          routerLink="/tasks"
          routerLinkActive="bg-blue-50 text-blue-700"
          class="rounded-md px-3 py-1.5 text-sm font-medium text-gray-600 hover:bg-gray-100"
        >Tasks</a>
        <a
          routerLink="/notes"
          routerLinkActive="bg-blue-50 text-blue-700"
          class="rounded-md px-3 py-1.5 text-sm font-medium text-gray-600 hover:bg-gray-100"
        >Notes</a>
        <a
          routerLink="/calendar"
          routerLinkActive="bg-blue-50 text-blue-700"
          class="rounded-md px-3 py-1.5 text-sm font-medium text-gray-600 hover:bg-gray-100"
        >Calendar</a>
        <button
          type="button"
          (click)="logout()"
          class="ml-2 rounded-md px-3 py-1.5 text-sm font-medium text-gray-500 hover:bg-gray-100"
        >Log out</button>
      </nav>
    </div>
  </header>

  <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-6" [class.pb-20]="auth.hasFamily()">
    <router-outlet></router-outlet>
  </main>

  <nav
    *ngIf="auth.hasFamily()"
    class="fixed inset-x-0 bottom-0 z-10 flex border-t border-gray-200 bg-white sm:hidden"
  >
    <a
      routerLink="/tasks"
      routerLinkActive="text-blue-700"
      class="flex flex-1 flex-col items-center gap-0.5 py-2.5 text-xs font-medium text-gray-500"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Tasks
    </a>
    <a
      routerLink="/notes"
      routerLinkActive="text-blue-700"
      class="flex flex-1 flex-col items-center gap-0.5 py-2.5 text-xs font-medium text-gray-500"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      Notes
    </a>
    <a
      routerLink="/calendar"
      routerLinkActive="text-blue-700"
      class="flex flex-1 flex-col items-center gap-0.5 py-2.5 text-xs font-medium text-gray-500"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      Calendar
    </a>
    <button
      type="button"
      (click)="logout()"
      class="flex flex-1 flex-col items-center gap-0.5 py-2.5 text-xs font-medium text-gray-500"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      Log out
    </button>
  </nav>
</div>
