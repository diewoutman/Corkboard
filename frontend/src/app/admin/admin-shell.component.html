<div class="flex min-h-screen flex-col bg-slate-900 text-slate-100">
  <header class="sticky top-0 z-20 border-b border-slate-700 bg-slate-800">
    <div class="mx-auto flex max-w-screen-2xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
      <div class="flex items-center gap-3">
        <span class="rounded-md bg-indigo-500 px-2 py-1 text-xs font-bold uppercase tracking-wide text-white">Admin</span>
        <span class="font-mono text-sm font-bold text-slate-300">Qorkboard</span>
      </div>

      <nav class="flex items-center gap-4 text-sm font-semibold text-slate-300">
        <a
          *ngFor="let link of navLinks"
          [routerLink]="link.route"
          routerLinkActive="text-indigo-400"
          class="rounded-md px-1 py-1.5 hover:text-white"
        >{{ link.label }}</a>
      </nav>

      <div class="flex items-center gap-3">
        <a routerLink="/home" class="text-xs font-semibold text-slate-400 hover:text-white">&larr; Back to Qorkboard</a>
        <button type="button" (click)="logout()" class="text-xs font-semibold text-slate-400 hover:text-white">Log out</button>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-screen-2xl flex-1 px-4 py-6 sm:px-6 lg:px-8">
    <router-outlet></router-outlet>
  </main>
</div>
