<h1 class="text-xl font-bold text-white">Families</h1>

<p *ngIf="errorMessage" class="mt-4 rounded-lg bg-rose-950 px-3 py-2 text-sm font-semibold text-rose-300">{{ errorMessage }}</p>

<p *ngIf="loading" class="mt-6 text-sm font-semibold text-slate-400">Loading…</p>

<p *ngIf="!loading && families.length === 0" class="mt-6 text-sm font-semibold text-slate-400">No families yet.</p>

<div *ngIf="!loading && families.length > 0" class="mt-4 overflow-hidden rounded-lg border border-slate-700">
  <table class="w-full text-left text-sm">
    <thead class="bg-slate-800 text-xs font-semibold uppercase tracking-wide text-slate-400">
      <tr>
        <th class="px-4 py-2">Name</th>
        <th class="px-4 py-2">Time zone</th>
        <th class="px-4 py-2">Members</th>
        <th class="px-4 py-2">Nodes</th>
        <th class="px-4 py-2">Created</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-700">
      <tr *ngFor="let family of families" [routerLink]="['/admin/families', family.id]" class="cursor-pointer bg-slate-900 hover:bg-slate-800">
        <td class="px-4 py-2.5 font-semibold text-white">{{ family.name }}</td>
        <td class="px-4 py-2.5 text-slate-300">{{ family.timeZone }}</td>
        <td class="px-4 py-2.5 text-slate-300">{{ family.memberCount }}</td>
        <td class="px-4 py-2.5 text-slate-300">{{ family.nodeCount }}</td>
        <td class="px-4 py-2.5 text-slate-400">{{ family.createdAt }}</td>
      </tr>
    </tbody>
  </table>
</div>
