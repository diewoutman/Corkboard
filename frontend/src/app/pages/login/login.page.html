<div class="mx-auto max-w-sm">
  <app-setup-step-header
    *ngIf="isFirstRun"
    [step]="1"
    [title]="'login.first_run_title' | transloco"
    [description]="'login.first_run_description' | transloco"
  />

  <h1 *ngIf="!isFirstRun" class="text-2xl font-extrabold text-ink">{{ 'login.log_in' | transloco }}</h1>

  <form (ngSubmit)="submit()" #form="ngForm" class="mt-6 space-y-4">
    <app-text-input [label]="'login.email' | transloco" type="email" [(ngModel)]="email" name="email" required autocomplete="email" />
    <app-text-input
      [label]="'login.password' | transloco"
      type="password"
      [(ngModel)]="password"
      name="password"
      required
      [minlength]="6"
      [autocomplete]="isFirstRun ? 'new-password' : 'current-password'"
    />

    <app-error-banner [message]="errorMessage" />

    <button
      type="submit"
      [disabled]="form.invalid || submitting"
      class="w-full rounded-full bg-coral px-4 py-2 text-sm font-extrabold text-white shadow-button hover:bg-coral-strong disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ (isFirstRun ? 'login.create_account' : 'login.log_in') | transloco }}
    </button>
  </form>

  <button
    *ngIf="!isProduction"
    type="button"
    [disabled]="submitting"
    (click)="seedAndLogIn()"
    class="mt-4 w-full rounded-full border-2 border-dashed border-border-soft px-4 py-2 text-sm font-bold text-ink-muted hover:border-coral hover:text-coral disabled:cursor-not-allowed disabled:opacity-50"
  >
    Seed test data &amp; log in (dev only)
  </button>
</div>
