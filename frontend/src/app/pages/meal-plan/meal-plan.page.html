<div>
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-2xl font-extrabold text-ink">{{ 'meal_plan.title' | transloco }} 🍽️</h1>
    <div class="flex items-center gap-2">
      <button type="button" (click)="prevWeek()" class="h-9 w-9 rounded-full bg-cork font-extrabold text-ink hover:bg-coral/20" aria-label="Previous week">‹</button>
      <button type="button" (click)="thisWeek()" class="rounded-xl bg-cork px-3 py-1.5 text-sm font-extrabold text-ink hover:bg-coral/20">
        {{ weekRangeLabel }}
      </button>
      <button type="button" (click)="nextWeek()" class="h-9 w-9 rounded-full bg-cork font-extrabold text-ink hover:bg-coral/20" aria-label="Next week">›</button>
    </div>
  </div>

  <app-error-banner [message]="errorMessage" />

  <app-loading-indicator *ngIf="loading" class="mt-8" />

  <div *ngIf="!loading" class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-7">
    <section *ngFor="let day of days; let i = index" class="rounded-2xl bg-white p-3 shadow-sticker">
      <h2 class="text-xs font-extrabold uppercase tracking-wide text-ink-muted">{{ 'weekdays.' + weekdayKeys[i] | transloco }}</h2>
      <p class="mb-2 text-sm font-bold text-ink">{{ day | date: 'd MMM' }}</p>

      <ul class="space-y-2">
        <li *ngFor="let meal of mealsFor(day)">
          <button
            type="button"
            (click)="openEditMeal(meal)"
            class="flex w-full flex-col items-start gap-0.5 rounded-xl bg-cork px-3 py-2 text-left text-sm font-bold text-ink hover:bg-coral/20"
          >
            <span>{{ meal.recipeTitle }}</span>
            <span class="text-xs font-semibold text-ink-muted">{{ 'meal_plan.servingsCount' | transloco: { count: meal.plannedServings } }}</span>
          </button>
          <button
            type="button"
            (click)="addToShoppingList(meal)"
            [disabled]="addingToList.isBusy(meal.id)"
            class="mt-1 text-xs font-bold text-coral hover:underline disabled:opacity-50"
          >
            + {{ 'meal_plan.addToShoppingList' | transloco }}
          </button>
          <p *ngIf="shoppingListFeedback?.mealId === meal.id" class="mt-0.5 text-xs font-semibold text-ink-muted">{{ shoppingListFeedback!.message }}</p>
        </li>
      </ul>

      <button
        type="button"
        (click)="openAddMealForm(day)"
        class="mt-2 w-full rounded-xl border-2 border-dashed border-border-soft px-2 py-1.5 text-xs font-bold text-ink-muted hover:border-coral hover:text-coral"
      >
        + {{ 'meal_plan.addMeal' | transloco }}
      </button>
    </section>
  </div>
</div>

<app-modal-sheet *ngIf="showMealForm" (dismissed)="closeMealForm()">
  <h2 class="text-lg font-extrabold text-ink">{{ mealDay | date: 'EEEE d MMM' }}</h2>

  <div class="mt-3">
    <input
      type="text"
      [(ngModel)]="recipeSearch"
      [placeholder]="'meal_plan.searchRecipes' | transloco"
      class="w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm"
    />
    <ul class="mt-2 max-h-48 space-y-1 overflow-y-auto">
      <li *ngFor="let recipe of filteredRecipes()">
        <button
          type="button"
          (click)="selectRecipe(recipe)"
          class="w-full rounded-xl px-3 py-2 text-left text-sm font-bold hover:bg-cork"
          [class.bg-cork]="selectedRecipeId === recipe.id"
        >
          {{ recipe.title }}
        </button>
      </li>
      <li *ngIf="filteredRecipes().length === 0" class="px-3 py-2 text-sm text-ink-muted">{{ 'meal_plan.noRecipes' | transloco }}</li>
    </ul>
  </div>

  <div *ngIf="selectedRecipeId" class="mt-3 flex items-center gap-2">
    <label class="text-sm font-bold text-ink" for="planned-servings">{{ 'meal_plan.plannedServings' | transloco }}</label>
    <button type="button" (click)="plannedServings = plannedServings > 1 ? plannedServings - 1 : 1" class="h-8 w-8 rounded-full bg-cork font-extrabold text-ink">−</button>
    <input id="planned-servings" type="number" min="1" [(ngModel)]="plannedServings" class="w-14 rounded-xl border-2 border-border-soft px-2 py-1 text-center" />
    <button type="button" (click)="plannedServings = plannedServings + 1" class="h-8 w-8 rounded-full bg-cork font-extrabold text-ink">+</button>
  </div>

  <div class="mt-4 flex items-center justify-between gap-3">
    <button
      *ngIf="editingMeal && !confirmingDeleteMeal"
      type="button"
      (click)="confirmingDeleteMeal = true"
      class="text-sm font-bold text-coral hover:underline"
    >
      {{ 'common.delete' | transloco }}
    </button>
    <ng-container *ngIf="editingMeal && confirmingDeleteMeal">
      <button type="button" (click)="deleteMeal()" [disabled]="removing.isBusy(editingMeal.id)" class="text-sm font-extrabold text-coral hover:underline">
        {{ 'meal_plan.confirmDeleteMeal' | transloco }}
      </button>
    </ng-container>
    <div class="ml-auto flex gap-2">
      <button type="button" (click)="closeMealForm()" class="rounded-xl px-4 py-2 text-sm font-bold text-ink-muted hover:bg-cork">
        {{ 'common.cancel' | transloco }}
      </button>
      <button
        type="button"
        (click)="submitMealForm()"
        [disabled]="!selectedRecipeId || submit.busy"
        class="rounded-xl bg-ink px-4 py-2 text-sm font-extrabold text-white disabled:opacity-50"
      >
        {{ (editingMeal ? 'common.save_changes' : 'common.create') | transloco }}
      </button>
    </div>
  </div>
</app-modal-sheet>
