<a routerLink="/tasks" class="text-sm font-extrabold text-coral hover:text-coral-strong">← {{ 'tasks.title' | transloco }}</a>

<div class="mt-2 flex items-center justify-between">
  <h1 class="text-2xl font-extrabold text-ink">{{ list?.name ?? ('common.loading' | transloco) }}</h1>
  <label class="flex items-center gap-2 text-sm font-bold text-ink-muted">
    <input type="checkbox" [(ngModel)]="showCompleted" name="showCompleted" class="rounded-md accent-coral" />
    {{ 'task_list.show_completed' | transloco }}
  </label>
</div>

<app-error-banner [message]="errorMessage" />

<app-quick-add-bar
  class="mt-4 block"
  [placeholder]="'task_list.quick_add_placeholder' | transloco"
  (submitted)="submitQuickAdd($event)"
/>

<app-loading-indicator *ngIf="loading" class="mt-8" />

<div *ngIf="!loading" class="mt-4 space-y-4">
  <div *ngFor="let group of groupedTasks">
    <h2 *ngIf="groupedTasks.length > 1" class="mb-1.5 text-xs font-extrabold uppercase tracking-wide text-ink-muted">
      {{ group.category ?? ('task_list.other' | transloco) }}
    </h2>
    <ul class="flex flex-col gap-2">
      <app-task-row
        *ngFor="let task of group.tasks"
        [task]="task"
        [members]="members"
        (toggleDone)="toggleDone(task)"
        (delete)="deleteTask(task)"
        (edit)="openEditTaskForm(task)"
      />
    </ul>
  </div>

  <app-empty-state *ngIf="visibleTasks.length === 0">{{ 'task_list.empty' | transloco }}</app-empty-state>
</div>

<app-modal-sheet *ngIf="showNewTaskForm" (dismissed)="closeTaskForm()">
  <form (ngSubmit)="submitTaskForm()" #form="ngForm" class="space-y-3">
    <h2 class="font-heading text-lg font-bold text-ink">{{ (editingTask ? 'task_list.edit' : 'task_list.add') | transloco }}</h2>
    <div>
      <label for="title" class="block text-sm font-bold text-ink">{{ 'task_list.task' | transloco }}</label>
      <input
        id="title"
        name="title"
        [(ngModel)]="newTask.title"
        required
        class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
      />
    </div>
    <div>
      <label for="description" class="block text-sm font-bold text-ink">{{ 'task_list.notes' | transloco }}</label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="newTask.description"
        rows="2"
        class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
      ></textarea>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label for="dueDate" class="block text-sm font-bold text-ink">{{ 'task_list.due_date' | transloco }}</label>
        <input id="dueDate" type="date" name="dueDate" [(ngModel)]="newTask.dueDate" class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral" />
      </div>
      <div>
        <label for="priority" class="block text-sm font-bold text-ink">{{ 'task_list.priority' | transloco }}</label>
        <select
          id="priority"
          name="priority"
          [(ngModel)]="newTask.priority"
          class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
        >
          <option [ngValue]="null">{{ 'task_list.priorities.none' | transloco }}</option>
          <option [ngValue]="1">{{ 'task_list.priorities.low' | transloco }}</option>
          <option [ngValue]="2">{{ 'task_list.priorities.medium' | transloco }}</option>
          <option [ngValue]="3">{{ 'task_list.priorities.high' | transloco }}</option>
        </select>
      </div>
    </div>
    <div *ngIf="newTask.dueDate">
      <label for="dueTime" class="block text-sm font-bold text-ink">{{ 'task_list.due_time' | transloco }} <span class="font-semibold text-ink-muted">{{ 'task_list.due_time_hint' | transloco }}</span></label>
      <input id="dueTime" type="time" name="dueTime" [(ngModel)]="newTask.dueTime" class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral" />
    </div>
    <div>
      <label for="category" class="block text-sm font-bold text-ink">{{ 'task_list.category' | transloco }} <span class="font-semibold text-ink-muted">{{ 'task_list.category_hint' | transloco }}</span></label>
      <input
        id="category"
        name="category"
        list="knownCategories"
        [placeholder]="'task_list.category_placeholder' | transloco"
        [(ngModel)]="newTask.category"
        class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
      />
      <datalist id="knownCategories">
        <option *ngFor="let category of knownCategories" [value]="category"></option>
      </datalist>
    </div>
    <div>
      <label for="repeat" class="block text-sm font-bold text-ink">{{ 'task_list.repeat' | transloco }} <span class="font-semibold text-ink-muted">{{ 'task_list.repeat_hint' | transloco }}</span></label>
      <select id="repeat" name="repeat" [(ngModel)]="newTask.repeat.preset" class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral">
        <option value="never">{{ 'task_list.repeats.never' | transloco }}</option>
        <option value="daily">{{ 'task_list.repeats.daily' | transloco }}</option>
        <option value="weekdays">{{ 'task_list.repeats.weekdays' | transloco }}</option>
        <option value="weekly">{{ 'task_list.repeats.weekly' | transloco }}</option>
        <option value="monthly">{{ 'task_list.repeats.monthly' | transloco }}</option>
        <option value="yearly">{{ 'task_list.repeats.yearly' | transloco }}</option>
        <option value="custom">{{ 'task_list.repeats.custom' | transloco }}</option>
      </select>
      <div *ngIf="newTask.repeat.preset === 'custom'" class="mt-2 space-y-2">
        <div class="flex items-center gap-2 text-sm font-bold text-ink">
          {{ 'task_list.repeat_every' | transloco }}
          <input type="number" min="1" name="repeatInterval" [(ngModel)]="newTask.repeat.interval" [attr.aria-label]="'task_list.repeat_every' | transloco" class="w-20 rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral" />
          <select name="repeatUnit" [(ngModel)]="newTask.repeat.unit" [attr.aria-label]="'task_list.repeat_unit' | transloco" class="rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral">
            <option value="day">{{ 'task_list.units.day' | transloco }}</option>
            <option value="week">{{ 'task_list.units.week' | transloco }}</option>
            <option value="month">{{ 'task_list.units.month' | transloco }}</option>
            <option value="year">{{ 'task_list.units.year' | transloco }}</option>
          </select>
        </div>
        <div *ngIf="newTask.repeat.unit === 'week'" class="flex flex-wrap gap-1.5" role="group" [attr.aria-label]="'task_list.repeat_weekdays' | transloco">
          <button
            *ngFor="let code of weekdayCodes"
            type="button"
            (click)="toggleWeekday(code)"
            [attr.aria-pressed]="newTask.repeat.weekdays.includes(code)"
            class="rounded-full border-2 px-3 py-1 text-xs font-extrabold"
            [class]="newTask.repeat.weekdays.includes(code) ? 'border-coral bg-coral text-white' : 'border-border-soft text-ink-muted hover:bg-cork'"
          >
            {{ 'task_list.weekdays.' + code | transloco }}
          </button>
        </div>
        <select *ngIf="newTask.repeat.unit === 'month'" name="monthlyMode" [(ngModel)]="newTask.repeat.monthlyMode" class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral">
          <option value="date">{{ 'task_list.monthly_modes.date' | transloco }}</option>
          <option value="nthWeekday">{{ 'task_list.monthly_modes.nth_weekday' | transloco }}</option>
        </select>
      </div>
    </div>
    <app-assignee-chip-group [members]="members" [selectedIds]="newTask.assignedFamilyMemberIds" (toggled)="toggleAssignee($event)" />

    <div class="flex gap-2 pt-1">
      <button type="submit" [disabled]="form.invalid" class="flex-1 rounded-full bg-coral px-4 py-2 text-sm font-extrabold text-white shadow-button hover:bg-coral-strong disabled:cursor-not-allowed disabled:opacity-50">
        {{ (editingTask ? 'common.save_changes' : 'task_list.add') | transloco }}
      </button>
      <button type="button" (click)="closeTaskForm()" class="rounded-full px-4 py-2 text-sm font-bold text-ink-muted hover:bg-cork">
        {{ 'common.cancel' | transloco }}
      </button>
    </div>
  </form>
</app-modal-sheet>

<app-fab-button *ngIf="!showNewTaskForm" [label]="'task_list.add' | transloco" (clicked)="openAddTaskForm()" />
