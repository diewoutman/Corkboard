<h1 class="text-2xl font-extrabold text-ink">{{ 'nav.notes' | transloco }} 📌</h1>

<app-error-banner [message]="errorMessage" />

<app-loading-indicator *ngIf="loading" class="mt-8" />

<div *ngIf="!loading" class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  <app-sticky-note-card
    *ngFor="let note of notes; let i = index"
    [note]="note"
    [members]="members"
    [index]="i"
    (toggleImportant)="toggleImportant(note)"
    (delete)="deleteNote(note)"
    (edit)="openEditNoteForm(note)"
  />

  <app-empty-state *ngIf="notes.length === 0" class="col-span-full">{{ 'notes.empty' | transloco }}</app-empty-state>
</div>

<app-load-more class="mt-4 block" [visible]="!loading && noteList.hasMore" [loading]="noteList.loadingMore" (more)="loadMore()" />

<app-modal-sheet *ngIf="editingNote" (dismissed)="closeNoteForm()">
  <app-note-editor [note]="editingNote" (saved)="onNoteSaved()" (cancelled)="closeNoteForm()" />
</app-modal-sheet>
