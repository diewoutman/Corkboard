<div class="flex items-center justify-between gap-2">
  <h1 class="text-2xl font-extrabold text-ink">{{ 'nav.family' | transloco }} 👨‍👩‍👧‍👦</h1>
</div>

<p class="mt-1 text-sm font-semibold text-ink-muted">
  {{ 'family.intro' | transloco }}
  {{ 'family.owner_note' | transloco }}
</p>

<app-error-banner [message]="errorMessage" />

<section class="mt-4 rounded-3xl bg-white p-4 shadow-sticker">
  <div class="flex items-center justify-between">
    <h2 class="text-lg font-extrabold text-ink">Groups</h2>
    <button type="button" (click)="openNewGroupForm()" class="rounded-full bg-coral px-3 py-1.5 text-xs font-extrabold text-white">+ Add group</button>
  </div>
  <form *ngIf="showGroupForm" (ngSubmit)="saveGroup()" class="mt-3 flex flex-wrap gap-2">
    <input name="groupName" [(ngModel)]="groupForm.name" required placeholder="Group name" class="min-w-0 flex-1 rounded-xl border-2 border-border-soft px-3 py-2 text-sm" />
    <label class="flex items-center gap-2 rounded-xl border-2 border-border-soft px-3 py-2 text-sm font-bold text-ink">
      Color
      <input name="groupColor" type="color" [(ngModel)]="groupForm.color" aria-label="Group color" class="h-6 w-8 cursor-pointer rounded" />
    </label>
    <button type="submit" class="rounded-full bg-coral px-3 py-1 text-xs font-bold text-white">Save</button>
  </form>
  <div *ngFor="let group of groups" class="mt-3 rounded-2xl bg-cork p-3">
    <div class="flex items-center justify-between">
      <span class="flex items-center gap-2 font-extrabold text-ink"><span class="h-3 w-3 rounded-full" [style.background-color]="group.color || '#ff8a65'"></span>{{ group.name }}</span>
      <span class="flex gap-2">
        <button type="button" (click)="openEditGroupForm(group)" class="text-xs font-bold text-coral">Edit</button>
        <button type="button" (click)="deleteGroup(group)" class="text-xs font-bold text-danger">Delete</button>
      </span>
    </div>
    <div class="mt-2 flex flex-wrap gap-2">
      <button *ngFor="let member of members" type="button" (click)="toggleMember(group, member.id)" [class.bg-coral]="group.memberIds.includes(member.id)" [class.text-white]="group.memberIds.includes(member.id)" class="rounded-full border border-border-soft px-2.5 py-1 text-xs font-bold">{{ member.displayName }}</button>
    </div>
  </div>
</section>

<app-loading-indicator *ngIf="loading" class="mt-8" />

<div *ngIf="!loading" class="mt-4 flex flex-col gap-3">
  <app-family-member-card
    *ngFor="let member of members"
    [member]="member"
    (edit)="openEditMemberForm(member)"
    (remove)="deleteMember(member)"
  >
    <div *ngIf="groupNames(member).length" class="mb-1 flex flex-wrap gap-1"><span *ngFor="let group of groupNames(member)" class="rounded-full px-2 py-0.5 text-[10px] font-extrabold text-white" [style.background-color]="group.color || '#ff8a65'">{{ group.name }}</span></div>
    <p *ngIf="!isOwner()" class="mt-1.5 text-xs font-semibold text-ink-muted">{{ 'family.no_login' | transloco }}</p>

    <button
      *ngIf="isOwner() && accountFormForId !== member.id"
      type="button"
      (click)="openAccountForm(member)"
      class="mt-1.5 text-xs font-extrabold text-coral hover:text-coral-strong"
    >
      + {{ 'family.create_login' | transloco }}
    </button>

    <form *ngIf="accountFormForId === member.id" (ngSubmit)="submitAccountForm()" #accountFormRef="ngForm" class="mt-2 space-y-2 rounded-2xl bg-cork p-3">
      <div>
        <label for="accountEmail" class="block text-xs font-bold text-ink">{{ 'login.email' | transloco }}</label>
        <input
          id="accountEmail"
          name="accountEmail"
          type="email"
          [(ngModel)]="accountForm.email"
          required
          class="mt-1 block w-full rounded-xl border-2 border-border-soft bg-white px-3 py-1.5 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
        />
      </div>
      <div>
        <label for="accountPassword" class="block text-xs font-bold text-ink">{{ 'login.password' | transloco }}</label>
        <input
          id="accountPassword"
          name="accountPassword"
          type="text"
          [(ngModel)]="accountForm.password"
          required
          minlength="6"
          class="mt-1 block w-full rounded-xl border-2 border-border-soft bg-white px-3 py-1.5 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
        />
        <p class="mt-0.5 text-[11px] font-semibold text-ink-muted">{{ 'family.password_hint' | transloco }}</p>
      </div>
      <div>
        <label for="accountRole" class="block text-xs font-bold text-ink">{{ 'family.role' | transloco }}</label>
        <select
          id="accountRole"
          name="accountRole"
          [(ngModel)]="accountForm.role"
          class="mt-1 block w-full rounded-xl border-2 border-border-soft bg-white px-3 py-1.5 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
        >
          <option value="Adult">{{ 'roles.Adult' | transloco }}</option>
          <option value="Member">{{ 'roles.Member' | transloco }}</option>
        </select>
      </div>
      <div class="flex gap-2 pt-1">
        <button type="submit" [disabled]="accountFormRef.invalid || submit.busy" class="flex-1 rounded-full bg-coral px-3 py-1.5 text-xs font-extrabold text-white shadow-button hover:bg-coral-strong disabled:cursor-not-allowed disabled:opacity-50">
          {{ 'family.create_login' | transloco }}
        </button>
        <button type="button" (click)="cancelAccountForm()" class="rounded-full px-3 py-1.5 text-xs font-bold text-ink-muted hover:bg-white">
          {{ 'common.cancel' | transloco }}
        </button>
      </div>
    </form>
  </app-family-member-card>

  <app-empty-state *ngIf="members.length === 0">{{ 'family.empty' | transloco }}</app-empty-state>
</div>

<div *ngIf="showMemberForm" class="mt-4 rounded-3xl bg-white p-4 shadow-sticker">
  <form (ngSubmit)="submitMemberForm()" #form="ngForm" class="space-y-3">
    <div>
      <label for="displayName" class="block text-sm font-bold text-ink">{{ 'common.name' | transloco }}</label>
      <input
        id="displayName"
        name="displayName"
        [(ngModel)]="memberForm.displayName"
        required
        class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
      />
    </div>
    <app-color-picker-field [label]="'common.color' | transloco" [(value)]="memberForm.color" />
    <div>
      <label for="dateOfBirth" class="block text-sm font-bold text-ink">{{ 'family.birthday' | transloco }} <span class="font-semibold text-ink-muted">{{ 'common.optional' | transloco }}</span></label>
      <input
        id="dateOfBirth"
        type="date"
        name="dateOfBirth"
        [(ngModel)]="memberForm.dateOfBirth"
        class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
      />
    </div>
    <div class="flex gap-2 pt-1">
      <button type="submit" [disabled]="form.invalid || submit.busy" class="flex-1 rounded-full bg-coral px-4 py-2 text-sm font-extrabold text-white shadow-button hover:bg-coral-strong disabled:cursor-not-allowed disabled:opacity-50">
        {{ (editingMemberId ? 'common.save_changes' : 'members.add') | transloco }}
      </button>
      <button type="button" (click)="cancelMemberForm()" class="rounded-full px-4 py-2 text-sm font-bold text-ink-muted hover:bg-cork">
        {{ 'common.cancel' | transloco }}
      </button>
    </div>
  </form>
</div>
