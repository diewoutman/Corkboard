<h1 class="text-2xl font-extrabold text-ink">{{ 'tasks.title' | transloco }} 📋</h1>

<app-error-banner [message]="errorMessage" />

<app-loading-indicator *ngIf="loading" class="mt-8" />

<div *ngIf="!loading" class="mt-4 space-y-6">
  <a *ngIf="inboxes.length > 0" routerLink="/tasks/inbox" class="block sm:max-w-sm">
    <app-list-card
      [name]="'tasks.inbox' | transloco"
      [color]="inboxes[0].color"
      [nodeCount]="inboxNodeCount"
      [incompleteCount]="inboxIncompleteCount"
      [editable]="false"
    />
  </a>

  <section *ngFor="let scope of scopes">
    <h2 class="mb-2 text-xs font-extrabold uppercase tracking-wide text-ink-muted">{{ 'tasks.scopes.' + scope | transloco }}</h2>
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <a *ngFor="let list of listsIn(scope)" [routerLink]="['/tasks', list.id]" class="contents">
        <app-list-card
          [name]="list.name"
          [color]="list.color"
          [nodeCount]="list.nodeCount"
          [incompleteCount]="list.incompleteCount"
          (edit)="openEditListForm(list)"
        />
      </a>
      <p *ngIf="listsIn(scope).length === 0" class="text-sm font-semibold text-ink-muted">{{ 'tasks.empty_scope' | transloco }}</p>
    </div>
  </section>

  <button
    *ngIf="!showNewListForm"
    type="button"
    (click)="openAddListForm()"
    class="flex min-h-[92px] w-full flex-col items-center justify-center gap-1 rounded-3xl border-4 border-dashed border-border-soft text-sm font-extrabold text-ink-muted hover:border-coral hover:text-coral sm:max-w-sm"
  >
    <span class="text-2xl leading-none">+</span>
    {{ 'tasks.new_list' | transloco }}
  </button>
</div>

<app-modal-sheet *ngIf="showNewListForm" (dismissed)="closeListForm()">
  <form (ngSubmit)="submitListForm()" #form="ngForm" class="space-y-3">
    <h2 class="font-heading text-lg font-bold text-ink">{{ (editingList ? 'tasks.edit_list' : 'tasks.new_list') | transloco }}</h2>
    <div>
      <label for="listName" class="block text-sm font-bold text-ink">{{ 'tasks.list_name' | transloco }}</label>
      <input
        id="listName"
        name="listName"
        [placeholder]="'tasks.list_name_placeholder' | transloco"
        [(ngModel)]="newListName"
        required
        class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
      />
    </div>
    <div *ngIf="!editingList">
      <label for="listScope" class="block text-sm font-bold text-ink">{{ 'tasks.list_scope' | transloco }}</label>
      <select
        id="listScope"
        name="listScope"
        [(ngModel)]="newListScope"
        class="mt-1 block w-full rounded-xl border-2 border-border-soft px-3 py-2 text-sm shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"
      >
        <option value="Family">{{ 'tasks.scopes.Family' | transloco }}</option>
        <option value="Personal">{{ 'tasks.scopes.Personal' | transloco }}</option>
      </select>
      <p class="mt-1 text-xs font-semibold text-ink-muted">{{ 'tasks.scope_hint.' + newListScope | transloco }}</p>
    </div>
    <app-color-picker-field [label]="'tasks.list_color' | transloco" [(value)]="newListColor" />
    <div class="flex gap-2 pt-1">
      <button type="submit" [disabled]="form.invalid || submitting" class="flex-1 rounded-full bg-coral px-4 py-2 text-sm font-extrabold text-white shadow-button hover:bg-coral-strong disabled:cursor-not-allowed disabled:opacity-50">
        {{ (editingList ? 'common.save_changes' : 'common.create') | transloco }}
      </button>
      <button type="button" (click)="closeListForm()" class="rounded-full px-4 py-2 text-sm font-bold text-ink-muted hover:bg-cork">
        {{ 'common.cancel' | transloco }}
      </button>
    </div>
  </form>
</app-modal-sheet>
