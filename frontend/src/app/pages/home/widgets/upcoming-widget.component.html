<app-loading-indicator *ngIf="loading" />

<div *ngIf="!loading" class="space-y-4">
  <div *ngIf="overdue.length > 0" class="rounded-3xl bg-danger-bg p-4 shadow-[0_4px_0_0_var(--color-danger-shadow)]">
    <h2 class="mb-2 font-heading text-sm font-bold text-danger-text-strong">Overdue ⚠️</h2>
    <ul class="flex flex-col gap-1.5">
      <app-agenda-list-item
        *ngFor="let item of overdue"
        [item]="item"
        [members]="members"
        [showAvatars]="true"
        titleMode="danger"
        timeFormat="mediumDate"
        (toggleDone)="toggleDone(item.task!)"
      />
    </ul>
  </div>

  <div *ngFor="let day of days">
    <h2 class="mb-1 flex items-baseline gap-2 text-xs font-extrabold text-ink">
      {{ day.label }}
      <span class="text-xs font-bold text-ink-muted">{{ day.date | date: 'MMM d' }}</span>
    </h2>
    <ul *ngIf="day.items.length > 0; else noItems" class="flex flex-col gap-1 pl-1">
      <app-agenda-list-item
        *ngFor="let item of day.items"
        [item]="item"
        [members]="members"
        [showAvatars]="true"
        titleMode="normal"
        size="sm"
        (toggleDone)="toggleDone(item.task!)"
      />
    </ul>
    <ng-template #noItems>
      <p class="pl-1 text-xs font-semibold text-ink-muted">Nothing planned.</p>
    </ng-template>
  </div>
</div>
