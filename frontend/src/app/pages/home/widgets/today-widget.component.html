<app-loading-indicator *ngIf="loading" />

<div *ngIf="!loading">
  <!-- One column per member with something due today (never an empty column) — auto-fit naturally
       lays out as many side by side as the widget's current width allows, wrapping down to a single
       stacked column on a narrow (span 1) widget. -->
  <div class="grid items-start gap-x-4 gap-y-3 grid-cols-[repeat(auto-fit,minmax(12rem,1fr))]">
    <div *ngFor="let group of groups">
      <div class="mb-1 flex items-center gap-1.5">
        <app-member-avatar *ngIf="group.member" [name]="group.member.displayName" [color]="group.member.color" size="xs" />
        <p class="text-xs font-extrabold text-ink">{{ group.member ? group.member.displayName : ('home.today.unassigned' | transloco) }}</p>
      </div>
      <ul class="flex flex-col gap-1 pl-1">
        <app-agenda-list-item *ngFor="let item of group.items" [item]="item" size="sm" (toggleDone)="toggleDone(item.task!)" />
      </ul>
    </div>
  </div>

  <p *ngIf="groups.length === 0" class="text-sm font-semibold text-ink-muted">{{ 'home.today.nothing_due' | transloco }} 🎉</p>
</div>
