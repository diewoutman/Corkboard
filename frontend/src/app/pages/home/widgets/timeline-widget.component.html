<app-loading-indicator *ngIf="loading" />

<div *ngIf="!loading">
  <p *ngIf="isEmpty" class="text-sm font-semibold text-ink-muted">Nothing on today's timeline. 🎉</p>

  <div
    *ngIf="!isEmpty"
    data-scroll-container
    class="relative max-h-80 overflow-y-auto pr-1"
    [class]="hourlyLayout ? 'space-y-1' : 'space-y-4'"
  >
    <div *ngFor="let segment of segments" [attr.data-segment]="segment.key">
      <h2 class="mb-1 flex items-center gap-1.5 text-xs font-extrabold" [class]="segment.key === currentKey ? 'text-coral' : 'text-ink'">
        {{ segment.label }}
        <span *ngIf="segment.key === currentKey" class="h-1.5 w-1.5 shrink-0 rounded-full bg-coral"></span>
      </h2>
      <ul *ngIf="segment.items.length > 0" class="flex flex-col gap-1 pl-1">
        <app-agenda-list-item
          *ngFor="let item of segment.items"
          [item]="item"
          [members]="members"
          [showAvatars]="true"
          titleMode="normal"
          size="sm"
          (toggleDone)="toggleDone(item.task!)"
        />
      </ul>
      <!-- Hourly has 24 slots, most empty — a "Nothing planned" line per slot would be pure noise;
           the bare hour label is enough of a ruler. Dayparts (only 4-5 slots) keeps it. -->
      <p *ngIf="segment.items.length === 0 && !hourlyLayout" class="pl-1 text-xs font-semibold text-ink-muted">Nothing planned.</p>
    </div>
  </div>
</div>
