<div *ngIf="loading" class="text-sm font-semibold text-ink-muted">Loading…</div>

<div *ngIf="!loading" class="grid gap-2.5 sm:grid-cols-2">
  <app-sticky-note-card
    *ngFor="let note of notes; let i = index"
    [note]="note"
    [members]="members"
    [index]="i"
    [interactive]="false"
  />
  <p *ngIf="notes.length === 0" class="text-sm font-semibold text-ink-muted">
    {{ importantOnly ? 'No important notes.' : 'No notes yet.' }}
  </p>
</div>

<a routerLink="/notes" class="mt-3 inline-block text-xs font-extrabold text-coral hover:text-coral-strong">View all notes →</a>
