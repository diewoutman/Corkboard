<div class="mx-auto max-w-sm">
  <app-setup-step-header
    [step]="3"
    [title]="'members.title' | transloco"
    [description]="'members.description' | transloco"
  />

  <ul *ngIf="!loading" class="mt-6 divide-y divide-cork rounded-xl border-2 border-border-soft">
    <li *ngFor="let member of members" class="flex items-center gap-3 px-3 py-2">
      <app-member-avatar [name]="member.displayName" [color]="member.color" size="sm" />
      <span class="flex-1 text-sm font-semibold text-ink">{{ member.displayName }}</span>
      <button
        type="button"
        (click)="removeMember(member)"
        class="text-ink-muted hover:text-danger"
        [attr.aria-label]="'members.remove' | transloco"
      >✕</button>
    </li>
  </ul>

  <form (ngSubmit)="addMember()" #form="ngForm" class="mt-6 space-y-4">
    <app-text-input [label]="'common.name' | transloco" [(ngModel)]="displayName" name="displayName" required [placeholder]="'members.name_placeholder' | transloco" />
    <app-color-picker-field [label]="'common.color' | transloco" [(value)]="color" />

    <button
      type="submit"
      [disabled]="form.invalid || submitting"
      class="w-full rounded-full border-2 border-coral px-4 py-2 text-sm font-extrabold text-coral hover:bg-pastel-coral disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ 'members.add' | transloco }}
    </button>
  </form>

  <app-error-banner [message]="errorMessage" />

  <button
    type="button"
    (click)="finish()"
    class="mt-6 w-full rounded-full bg-coral px-4 py-2 text-sm font-extrabold text-white shadow-button hover:bg-coral-strong"
  >
    {{ 'members.finish' | transloco }}
  </button>
</div>
